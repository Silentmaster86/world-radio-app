<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Radio App — offline</title>
    <style>
      html {
        color-scheme: light dark;
      }
      body {
        font:
          1rem/1.6 system-ui,
          sans-serif;
        max-width: 38rem;
        margin: 4rem auto;
        padding: 1rem;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1rem;
        border: 1px solid currentColor;
        border-radius: 0.6rem;
      }
      a:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Open your saved stations below. Live radio needs an internet connection.</p>
      <p>If offline access has not finished preparing, reconnect and open the app once more.</p>
      <a href="/">Open saved stations</a>
    </main>
  </body>
</html>
