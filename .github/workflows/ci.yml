name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  ux-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated browser check tools
        run: |
          npm install --prefix "$RUNNER_TEMP/wra-browser" --no-audit --no-fund --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/wra-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check browser layout, navigation and accessibility
        run: NODE_PATH="$RUNNER_TEMP/wra-browser/node_modules" node scripts/check-ux.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-browser-results
          path: test-results/ux
          if-no-files-found: ignore
