name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  ux-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: wra-browsers-${{ runner.os }}-playwright-1.56.1
      - name: Install isolated browser check tools
        timeout-minutes: 4
        run: |
          npm install --prefix "$RUNNER_TEMP/wra-browser" --prefer-offline --no-audit --no-fund --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/wra-browser/node_modules/.bin/playwright" install chromium
      - name: Check browser layout, navigation and accessibility
        run: NODE_PATH="$RUNNER_TEMP/wra-browser/node_modules" node scripts/check-ux.cjs
      - name: Check offline access and safe PWA updates
        run: NODE_PATH="$RUNNER_TEMP/wra-browser/node_modules" node scripts/check-pwa.cjs
      - name: Check the current Netlify preview and direct routes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WRA_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--worldradioapp.netlify.app
        run: |
          node scripts/check-preview.cjs
          NODE_PATH="$RUNNER_TEMP/wra-browser/node_modules" node scripts/check-ux.cjs
          NODE_PATH="$RUNNER_TEMP/wra-browser/node_modules" node scripts/check-pwa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-browser-results
          path: test-results/ux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-browser-results
          path: test-results/pwa
          if-no-files-found: ignore

  performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/setup-node@v7
        with:
          node-version-file: candidate/.nvmrc
          cache: npm
          cache-dependency-path: |
            candidate/package-lock.json
            baseline/package-lock.json
      - run: npm ci
        working-directory: baseline
      - run: npm run build
        working-directory: baseline
      - run: npm ci
        working-directory: candidate
      - run: npm run build
        working-directory: candidate
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: wra-browsers-${{ runner.os }}-playwright-1.62.1
      - name: Install isolated performance tools
        timeout-minutes: 4
        run: |
          npm install --prefix "$RUNNER_TEMP/wra-performance" --prefer-offline --no-audit --no-fund --package-lock=false playwright@1.62.1 lighthouse@13.6.0
          "$RUNNER_TEMP/wra-performance/node_modules/.bin/playwright" install chromium
      - name: Compare baseline and candidate with mobile and desktop Lighthouse
        working-directory: candidate
        env:
          WRA_BASE_BUILD: ${{ github.workspace }}/baseline/build
          PERFORMANCE_RUNS: 3
          WRA_PRODUCTION_URL: https://worldradioapp.netlify.app/
        run: NODE_PATH="$RUNNER_TEMP/wra-performance/node_modules" node scripts/measure-performance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: candidate/test-results/performance
          if-no-files-found: ignore
