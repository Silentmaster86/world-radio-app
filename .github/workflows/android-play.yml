name: Android Play preparation

on:
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/android-*'
      - '.github/workflows/android-play.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/android-*'
      - '.github/workflows/android-play.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Download pinned official bundletool
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Check preview and Play signing boundaries
        run: npm run test:android
      - name: Build and validate the unsigned Play release candidate
        run: npm run play:bundle
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/world-radio-android-user
          WORLD_RADIO_BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
      - uses: actions/upload-artifact@v7
        with:
          name: world-radio-play-unsigned-NOT-FOR-UPLOAD
          if-no-files-found: error
          retention-days: 14
          path: android/artifacts/play/unsigned/*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-play-lint-results
          path: android/app/build/reports/lint-results-*
